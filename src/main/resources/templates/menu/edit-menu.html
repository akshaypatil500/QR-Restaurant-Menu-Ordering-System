<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Main Content -->
<div class="main">

    <!-- Header -->
    <div class="header">

        <h3>Edit Menu</h3>

        <div>

            <a th:href="@{/menu/list}" class="btn btn-light">

                <i class="fa-solid fa-list"></i>

                Menu List

            </a>

        </div>

    </div>

    <!-- Content -->

    <div class="content">

        <div class="container-fluid">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card shadow border-0 rounded-4">

                        <div class="card-header bg-primary text-white">

                            <h4 class="mb-0">

                                <i class="fa-solid fa-pen-to-square"></i>

                                Edit Menu Item

                            </h4>

                        </div>

                        <div class="card-body">

                            <form
                                    th:action="@{/menu/update}"
                                    th:object="${menu}"
                                    method="post"
                                    enctype="multipart/form-data">

                                <!-- Hidden ID -->

                                <input type="hidden"
                                       th:field="*{id}">

                                <!-- Menu Name -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Menu Name

                                    </label>

                                    <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{name}"
                                            placeholder="Enter Menu Name"
                                            required>

                                </div>

                                <!-- Description -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Description

                                    </label>

                                    <textarea
                                            class="form-control"
                                            rows="3"
                                            th:field="*{description}"
                                            placeholder="Enter Description">
                                    </textarea>

                                </div>

                                <!-- Category -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Category

                                    </label>

                                    <select
                                            class="form-select"
                                            th:field="*{category.id}"
                                            required>

                                        <option value="">
                                            Select Category
                                        </option>

                                        <option
                                                th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}">
                                        </option>

                                    </select>

                                </div>

                                <!-- Price -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Price

                                    </label>

                                    <input
                                            type="number"
                                            step="0.01"
                                            class="form-control"
                                            th:field="*{price}"
                                            required>

                                </div>

                                <!-- Food Type -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Food Type

                                    </label>

                                    <br>

                                    <div class="form-check form-check-inline">

                                        <input
                                                class="form-check-input"
                                                type="radio"
                                                th:field="*{veg}"
                                                value="true">

                                        <label class="form-check-label">

                                            Veg

                                        </label>

                                    </div>

                                    <div class="form-check form-check-inline">

                                        <input
                                                class="form-check-input"
                                                type="radio"
                                                th:field="*{veg}"
                                                value="false">

                                        <label class="form-check-label">

                                            Non Veg

                                        </label>

                                    </div>

                                </div>

                                <!-- Availability -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Availability

                                    </label>

                                    <br>

                                    <div class="form-check form-check-inline">

                                        <input
                                                class="form-check-input"
                                                type="radio"
                                                th:field="*{available}"
                                                value="true">

                                        <label class="form-check-label">

                                            Available

                                        </label>

                                    </div>

                                    <div class="form-check form-check-inline">

                                        <input
                                                class="form-check-input"
                                                type="radio"
                                                th:field="*{available}"
                                                value="false">

                                        <label class="form-check-label">

                                            Unavailable

                                        </label>

                                    </div>

                                </div>

                                <!-- Current Image -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Current Image

                                    </label>

                                    <br>

                                    <img
                                            th:if="${menu.imageName != null}"
                                            th:src="@{'/uploads/menu/' + ${menu.imageName}}"
                                            width="150"
                                            class="img-thumbnail rounded">

                                </div>

                                <!-- Upload New Image -->

                                <div class="mb-4">

                                    <label class="form-label">

                                        Change Image

                                    </label>

                                    <input
                                            type="file"
                                            class="form-control"
                                            name="imageFile"
                                            accept="image/*">

                                    <small class="text-muted">

                                        Leave empty if you don't want to change the image.

                                    </small>

                                </div>

                                <!-- Buttons -->

                                <div class="text-center">

                                    <button
                                            type="submit"
                                            class="btn btn-primary px-4">

                                        <i class="fa-solid fa-floppy-disk"></i>

                                        Update Menu

                                    </button>

                                    <a
                                            th:href="@{/menu/list}"
                                            class="btn btn-secondary px-4">

                                        Cancel

                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <div th:replace="fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
