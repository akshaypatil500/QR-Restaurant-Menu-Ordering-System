<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Details</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1100px;
        }

        .page-title {
            font-weight: 700;
        }

        .order-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .info-label {
            font-weight: 600;
            color: #6c757d;
        }

        .grand-total {
            font-size: 22px;
            font-weight: 700;
        }

        .status-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

    </style>

</head>

<body>

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">
                <i class="fa-solid fa-receipt"></i>
                Order Details
            </h2>

            <p class="text-muted mb-0">
                View order information and update order status
            </p>
        </div>

        <a th:href="@{/order/list}"
           class="btn btn-secondary">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Orders

        </a>

    </div>


    <!-- Order Information -->
    <div class="card order-card mb-4">

        <div class="card-body">

            <div class="row">

                <!-- Order ID -->
                <div class="col-md-3 mb-3">

                    <div class="info-label">
                        Order ID
                    </div>

                    <div class="fs-5 fw-bold"
                         th:text="${order.id}">
                    </div>

                </div>


                <!-- Table Number -->
                <div class="col-md-3 mb-3">

                    <div class="info-label">
                        Table Number
                    </div>

                    <div class="fs-5 fw-bold"
                         th:text="${order.table.tableNumber}">
                    </div>

                </div>


                <!-- Order Date -->
                <div class="col-md-3 mb-3">

                    <div class="info-label">
                        Order Date
                    </div>

                    <div class="fs-6"
                         th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">
                    </div>

                </div>


                <!-- Status -->
                <div class="col-md-3 mb-3">

                    <div class="info-label">
                        Current Status
                    </div>

                    <div>

                        <span
                            th:if="${order.status == 'Pending'}"
                            class="badge bg-warning text-dark">
                            Pending
                        </span>

                        <span
                            th:if="${order.status == 'Preparing'}"
                            class="badge bg-primary">
                            Preparing
                        </span>

                        <span
                            th:if="${order.status == 'Ready'}"
                            class="badge bg-success">
                            Ready
                        </span>

                        <span
                            th:if="${order.status == 'Served'}"
                            class="badge bg-info text-dark">
                            Served
                        </span>

                        <span
                            th:if="${order.status == 'Paid'}"
                            class="badge bg-dark">
                            Paid
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Order Items -->
    <div class="card order-card mb-4">

        <div class="card-header bg-white">

            <h5 class="mb-0">

                <i class="fa-solid fa-utensils"></i>
                Ordered Items

            </h5>

        </div>


        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>#</th>

                            <th>Food</th>

                            <th>Price</th>

                            <th>Quantity</th>

                            <th>Total</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="item, stat : ${items}">

                            <!-- Sr No -->
                            <td th:text="${stat.count}">
                            </td>


                            <!-- Food Name -->
                            <td>

                                <span
                                    th:text="${item.menu.name}"
                                    class="fw-semibold">
                                </span>

                            </td>


                            <!-- Price -->
                            <td>

                                ₹<span
                                    th:text="${item.price}">
                                </span>

                            </td>


                            <!-- Quantity -->
                            <td>

                                <span
                                    class="badge bg-secondary"
                                    th:text="${item.quantity}">
                                </span>

                            </td>


                            <!-- Total -->
                            <td class="fw-semibold">

                                ₹<span
                                    th:text="${item.totalPrice}">
                                </span>

                            </td>

                        </tr>


                        <!-- Empty Items -->
                        <tr th:if="${#lists.isEmpty(items)}">

                            <td colspan="5"
                                class="text-center text-muted py-4">

                                <i class="fa-solid fa-circle-info"></i>
                                No items found for this order.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Bottom Section -->
    <div class="row">


        <!-- Grand Total -->
        <div class="col-md-6 mb-4">

            <div class="card order-card h-100">

                <div class="card-body">

                    <h5 class="mb-3">

                        <i class="fa-solid fa-money-bill-wave"></i>
                        Order Summary

                    </h5>

                    <div class="d-flex justify-content-between">

                        <span>
                            Grand Total
                        </span>

                        <span class="grand-total">

                            ₹<span
                                th:text="${order.grandTotal}">
                            </span>

                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- Update Status -->
        <div class="col-md-6 mb-4">

            <div class="card order-card h-100">

                <div class="card-body">

                    <h5 class="mb-3">

                        <i class="fa-solid fa-pen-to-square"></i>
                        Update Order Status

                    </h5>


                    <div class="status-form">

                        <form
                            th:action="@{'/order/status/' + ${order.id}}"
                            method="post">


                            <!-- CSRF Token -->
                            <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">


                            <!-- Status -->
                            <div class="mb-3">

                                <label
                                    class="form-label fw-semibold">
                                    Select Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                    required>

                                    <option
                                        value="Pending"
                                        th:selected="${order.status == 'Pending'}">
                                        Pending
                                    </option>

                                    <option
                                        value="Preparing"
                                        th:selected="${order.status == 'Preparing'}">
                                        Preparing
                                    </option>

                                    <option
                                        value="Ready"
                                        th:selected="${order.status == 'Ready'}">
                                        Ready
                                    </option>

                                    <option
                                        value="Served"
                                        th:selected="${order.status == 'Served'}">
                                        Served
                                    </option>

                                    <option
                                        value="Paid"
                                        th:selected="${order.status == 'Paid'}">
                                        Paid
                                    </option>

                                </select>

                            </div>


                            <!-- Update Button -->
                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                <i class="fa-solid fa-check"></i>
                                Update Status

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Dashboard Button -->
    <div class="text-center mt-2">

        <a th:href="@{/dashboard}"
           class="btn btn-outline-primary">

            <i class="fa-solid fa-house"></i>
            Dashboard

        </a>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
