<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Order List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body style="background:#f5f7fb;">

<div class="container mt-4">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">

            <i class="fa-solid fa-receipt"></i>

            Order Management

        </h2>

        <a th:href="@{/dashboard}"
           class="btn btn-secondary">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </div>

    <!-- Order Table -->

    <div class="card shadow border-0">

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-primary">

                <tr>

                    <th>Order ID</th>

                    <th>Table</th>

                    <th>Order Date</th>

                    <th>Grand Total</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="order : ${orders}">

                    <!-- Order ID -->

                    <td th:text="${order.id}"></td>

                    <!-- Table -->

                    <td th:text="${order.table.tableNumber}"></td>

                    <!-- Date -->

                    <td th:text="${#temporals.format(order.orderDate,'dd-MM-yyyy HH:mm')}"></td>

                    <!-- Grand Total -->

                    <td>

                        ₹ <span th:text="${order.grandTotal}"></span>

                    </td>

                    <!-- Status -->

                    <td>

                        <!-- Pending -->

                        <span
                            th:if="${order.status=='Pending'}"
                            class="badge bg-warning text-dark">

                            Pending

                        </span>

                        <!-- Preparing -->

                        <span
                            th:if="${order.status=='Preparing'}"
                            class="badge bg-primary">

                            Preparing

                        </span>

                        <!-- Ready -->

                        <span
                            th:if="${order.status=='Ready'}"
                            class="badge bg-success">

                            Ready

                        </span>

                        <!-- Served -->

                        <span
                            th:if="${order.status=='Served'}"
                            class="badge bg-info">

                            Served

                        </span>

                        <!-- Paid -->

                        <span
                            th:if="${order.status=='Paid'}"
                            class="badge bg-dark">

                            Paid

                        </span>

                    </td>

                    <!-- Action -->

                    <td>

                        <a
                            th:href="@{'/order/details/' + ${order.id}}"
                            class="btn btn-primary btn-sm">

                            <i class="fa-solid fa-eye"></i>

                            View

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <!-- Empty -->

            <div
                    th:if="${#lists.isEmpty(orders)}"
                    class="alert alert-warning text-center">

                No Orders Found

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
