<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kitchen Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Auto Refresh -->
    <meta http-equiv="refresh" content="30">

</head>

<body style="background:#f5f7fb;">

<div class="container-fluid py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">

            <i class="fa-solid fa-kitchen-set"></i>
            Kitchen Dashboard

        </h2>

        <a th:href="@{/dashboard}"
           class="btn btn-secondary">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </a>

    </div>


    <div class="row">


        <!-- ================= PENDING ORDERS ================= -->

        <div class="col-md-4">

            <div class="card shadow border-0">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">
                        Pending Orders
                    </h4>

                </div>


                <div class="card-body">

                    <!-- Empty State -->
                    <div th:if="${#lists.isEmpty(pendingOrders)}">

                        <p class="text-muted">
                            No Pending Orders
                        </p>

                    </div>


                    <!-- Pending Orders -->
                    <div th:each="order : ${pendingOrders}"
                         class="card mb-3 shadow-sm">

                        <div class="card-body">

                            <h5>

                                Order #

                                <span th:text="${order.id}">
                                </span>

                            </h5>


                            <p>

                                <b>Table :</b>

                                <span th:text="${order.table.tableNumber}">
                                </span>

                            </p>


                            <p>

                                <b>Total :</b>

                                ₹ <span th:text="${order.grandTotal}">
                                </span>

                            </p>


                            <!-- Start Preparing -->
                            <form th:action="@{'/kitchen/status/' + ${order.id}}"
                                  method="post">

                                <!-- CSRF Token -->
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <input type="hidden"
                                       name="status"
                                       value="Preparing">

                                <button type="submit"
                                        class="btn btn-primary w-100">

                                    <i class="fa-solid fa-fire"></i>
                                    Start Preparing

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= PREPARING ORDERS ================= -->

        <div class="col-md-4">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Preparing
                    </h4>

                </div>


                <div class="card-body">

                    <!-- Empty State -->
                    <div th:if="${#lists.isEmpty(preparingOrders)}">

                        <p class="text-muted">
                            No Preparing Orders
                        </p>

                    </div>


                    <!-- Preparing Orders -->
                    <div th:each="order : ${preparingOrders}"
                         class="card mb-3 shadow-sm">

                        <div class="card-body">

                            <h5>

                                Order #

                                <span th:text="${order.id}">
                                </span>

                            </h5>


                            <p>

                                <b>Table :</b>

                                <span th:text="${order.table.tableNumber}">
                                </span>

                            </p>


                            <p>

                                <b>Total :</b>

                                ₹ <span th:text="${order.grandTotal}">
                                </span>

                            </p>


                            <!-- Mark Ready -->
                            <form th:action="@{'/kitchen/status/' + ${order.id}}"
                                  method="post">

                                <!-- CSRF Token -->
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <input type="hidden"
                                       name="status"
                                       value="Ready">

                                <button type="submit"
                                        class="btn btn-success w-100">

                                    <i class="fa-solid fa-check"></i>
                                    Mark Ready

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= READY ORDERS ================= -->

        <div class="col-md-4">

            <div class="card shadow border-0">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        Ready To Serve
                    </h4>

                </div>


                <div class="card-body">

                    <!-- Empty State -->
                    <div th:if="${#lists.isEmpty(readyOrders)}">

                        <p class="text-muted">
                            No Ready Orders
                        </p>

                    </div>


                    <!-- Ready Orders -->
                    <div th:each="order : ${readyOrders}"
                         class="card mb-3 shadow-sm">

                        <div class="card-body">

                            <h5>

                                Order #

                                <span th:text="${order.id}">
                                </span>

                            </h5>


                            <p>

                                <b>Table :</b>

                                <span th:text="${order.table.tableNumber}">
                                </span>

                            </p>


                            <p>

                                <b>Total :</b>

                                ₹ <span th:text="${order.grandTotal}">
                                </span>

                            </p>


                            <!-- Mark Served -->
                            <form th:action="@{'/kitchen/status/' + ${order.id}}"
                                  method="post">

                                <!-- CSRF Token -->
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <input type="hidden"
                                       name="status"
                                       value="Served">

                                <button type="submit"
                                        class="btn btn-dark w-100">

                                    <i class="fa-solid fa-bell"></i>
                                    Mark Served

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
