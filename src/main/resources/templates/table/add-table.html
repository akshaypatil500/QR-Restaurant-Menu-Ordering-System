<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head"></head>

<body>

	<!-- Sidebar -->
	<div th:replace="fragments/navbar :: navbar"></div>

	<!-- Main Content -->
	<div class="main">

		<!-- Header -->
		<div class="header">

			<h3>Table Management</h3>

			<div>

				<a th:href="@{/table/list}" class="btn btn-light">

					<i class="fa-solid fa-list"></i>

					Table List

				</a>

			</div>

		</div>

		<!-- Content -->

		<div class="content">

			<div class="container-fluid">

				<div class="row justify-content-center">

					<div class="col-lg-8">

						<div class="card shadow border-0 rounded-4">

							<div class="card-header bg-primary text-white">

								<h4 class="mb-0">

									<i class="fa-solid fa-chair"></i>

									Add Restaurant Table

								</h4>

							</div>

							<div class="card-body">

								<form th:action="@{/table/save}" th:object="${restaurantTable}" method="post">

									<!-- Table Number -->

									<div class="mb-3">

										<label class="form-label">

											Table Number

										</label>

										<input type="number" class="form-control" th:field="*{tableNumber}"
											placeholder="Enter Table Number">

										<div class="text-danger mt-1" th:if="${#fields.hasErrors('tableNumber')}"
											th:errors="*{tableNumber}">
										</div>

									</div>

									<!-- Capacity -->

									<div class="mb-3">

										<label class="form-label">

											Seating Capacity

										</label>

										<input type="number" class="form-control" th:field="*{capacity}"
											placeholder="Enter Capacity">

										<div class="text-danger mt-1" th:if="${#fields.hasErrors('capacity')}"
											th:errors="*{capacity}">
										</div>

									</div>

									<!-- Table Status -->

									<div class="mb-3">

										<label class="form-label">

											Table Status

										</label>

										<select class="form-select" th:field="*{status}">

											<option value="AVAILABLE">

												Available

											</option>

											<option value="OCCUPIED">

												Occupied

											</option>

											<option value="RESERVED">

												Reserved

											</option>

										</select>

									</div>

									<!-- Active -->

									<div class="mb-4">

										<label class="form-label">

											Table Active

										</label>

										<br>

										<div class="form-check form-check-inline">

											<input class="form-check-input" type="radio" th:field="*{active}"
												value="true">

											<label class="form-check-label">

												Active

											</label>

										</div>

										<div class="form-check form-check-inline">

											<input class="form-check-input" type="radio" th:field="*{active}"
												value="false">

											<label class="form-check-label">

												Inactive

											</label>

										</div>

									</div>

									<!-- Buttons -->

									<div class="text-center">

										<button type="submit" class="btn btn-primary">

											<i class="fa-solid fa-floppy-disk"></i>

											Save Table

										</button>

										<button type="reset" class="btn btn-secondary">

											Reset

										</button>

										<a th:href="@{/table/list}" class="btn btn-success">

											View Tables

										</a>

									</div>

								</form>

							</div>

						</div>

					</div>

				</div>

			</div>

		</div>

		<!-- Footer -->

		<div th:replace="fragments/footer :: footer"></div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
