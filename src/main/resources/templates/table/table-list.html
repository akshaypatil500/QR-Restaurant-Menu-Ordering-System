<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Main Content -->
<div class="main">

    <!-- Header -->
    <div class="header">

        <h3>Restaurant Tables</h3>

        <div>

            <a th:href="@{/table/add}" class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Add Table

            </a>

        </div>

    </div>

    <!-- Content -->

    <div class="content">

        <div class="container-fluid">
			
			<!-- Success Message -->

			<div
			    th:if="${success}"
			    class="alert alert-success alert-dismissible fade show">

			    <span th:text="${success}"></span>

			    <button
			        type="button"
			        class="btn-close"
			        data-bs-dismiss="alert"></button>

			</div>

			<!-- Error Message -->

			<div
			    th:if="${error}"
			    class="alert alert-danger alert-dismissible fade show">

			    <span th:text="${error}"></span>

			    <button
			        type="button"
			        class="btn-close"
			        data-bs-dismiss="alert"></button>

			</div>

            <div class="card shadow border-0 rounded-4">

                <div
                    class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

                    <h4 class="mb-0">

                        <i class="fa-solid fa-chair"></i>

                        Restaurant Tables

                    </h4>

                    <span class="badge bg-light text-dark"
                          th:text="'Total Tables : '+${#lists.size(tables)}">

                    </span>

                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>

                                <th>ID</th>

                                <th>Table No.</th>

                                <th>Capacity</th>

                                <th>Status</th>

                                <th>Active</th>

                                <th>QR Code</th>

                                <th width="230">Action</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="table : ${tables}">

                                <!-- ID -->

                                <td th:text="${table.id}"></td>

                                <!-- Table Number -->

                                <td>

                                    <strong>

                                        Table -

                                        <span th:text="${table.tableNumber}"></span>

                                    </strong>

                                </td>

                                <!-- Capacity -->

                                <td>

                                    <i class="fa-solid fa-users"></i>

                                    <span th:text="${table.capacity}"></span>

                                </td>

                                <!-- Status -->

                                <td>

                                    <span
                                            th:if="${table.status=='AVAILABLE'}"
                                            class="badge bg-success">

                                        Available

                                    </span>

                                    <span
                                            th:if="${table.status=='OCCUPIED'}"
                                            class="badge bg-danger">

                                        Occupied

                                    </span>

                                    <span
                                            th:if="${table.status=='RESERVED'}"
                                            class="badge bg-warning text-dark">

                                        Reserved

                                    </span>

                                </td>

                                <!-- Active -->

                                <td>

                                    <span
                                            th:if="${table.active}"
                                            class="badge bg-primary">

                                        Active

                                    </span>

                                    <span
                                            th:unless="${table.active}"
                                            class="badge bg-secondary">

                                        Inactive

                                    </span>

                                </td>

                                <!-- QR -->

                                <td>

                                    <img
                                            th:if="${table.qrCodeImage!=null}"
                                            th:src="@{'/uploads/qr/'+${table.qrCodeImage}}"
                                            width="70"
                                            height="70"
                                            class="img-thumbnail">

                                    <span
                                            th:unless="${table.qrCodeImage!=null}"
                                            class="text-muted">

                                        Not Generated

                                    </span>

                                </td>

                                <!-- Action -->

								<!-- Action -->
								<td>

								    <!-- Edit -->
								    <a
								            th:href="@{'/table/edit/'+${table.id}}"
								            class="btn btn-warning btn-sm"
								            title="Edit Table">

								        <i class="fa-solid fa-pen"></i>

								    </a>

								    <!-- View QR -->
								    <a
								            th:if="${table.qrCodeImage != null}"
								            th:href="@{'/uploads/qr/'+${table.qrCodeImage}}"
								            target="_blank"
								            class="btn btn-info btn-sm"
								            title="View QR">

								        <i class="fa-solid fa-qrcode"></i>

								    </a>

								    <!-- Generate QR -->
								    <a
								            th:if="${table.qrCodeImage == null}"
								            th:href="@{'/table/regenerate-qr/'+${table.id}}"
								            class="btn btn-success btn-sm"
								            title="Generate QR">

								        <i class="fa-solid fa-qrcode"></i>

								    </a>

								    <!-- Regenerate QR -->
								    <a
								            th:if="${table.qrCodeImage != null}"
								            th:href="@{'/table/regenerate-qr/'+${table.id}}"
								            onclick="return confirm('Regenerate QR code for this table?')"
								            class="btn btn-secondary btn-sm"
								            title="Regenerate QR">

								        <i class="fa-solid fa-rotate"></i>

								    </a>

								    <!-- Delete -->
								    <a
								            th:href="@{'/table/delete/'+${table.id}}"
								            onclick="return confirm('Are you sure you want to delete this table?')"
								            class="btn btn-danger btn-sm"
								            title="Delete Table">

								        <i class="fa-solid fa-trash"></i>

								    </a>

								</td>

                            </tr>

                            <!-- Empty Data -->

                            <tr th:if="${#lists.isEmpty(tables)}">

                                <td colspan="7"
                                    class="text-center text-muted">

                                    No Restaurant Tables Found

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <div th:replace="fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
