<th:block th:replace="fragments/head"></th:block>

<!-- Header -->

<div class="header">

    <h3>Dashboard</h3>

    <div>
        Welcome,
        <strong>Admin</strong>
    </div>

</div>

<!-- Content -->

<div class="content">

    <div class="container-fluid">

        <!-- First Row -->

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Total Categories</h5>

                    <h2 th:text="${totalCategories}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Total Menu</h5>

                    <h2 th:text="${totalMenus}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Total Tables</h5>

                    <h2 th:text="${totalTables}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Total Orders</h5>

                    <h2 th:text="${totalOrders}">0</h2>

                </div>

            </div>

        </div>

        <!-- Second Row -->

        <div class="row g-4 mt-2">

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Pending Orders</h5>

                    <h2 th:text="${pendingOrders}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Preparing</h5>

                    <h2 th:text="${preparingOrders}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Ready</h5>

                    <h2 th:text="${readyOrders}">0</h2>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card-box">

                    <h5>Served</h5>

                    <h2 th:text="${servedOrders}">0</h2>

                </div>

            </div>

        </div>

        <!-- Quick Actions -->

        <div class="row mt-5">

            <div class="col-lg-12">

                <div class="card-box">

                    <h4>Quick Actions</h4>

                    <hr>

                    <a class="btn btn-primary me-2"
                       th:href="@{/category/add}">

                        Add Category

                    </a>

                    <a class="btn btn-success me-2"
                       th:href="@{/menu/add}">

                        Add Menu

                    </a>

                    <a class="btn btn-warning me-2"
                       th:href="@{/table/add}">

                        Add Table

                    </a>

                    <a class="btn btn-dark"
                       th:href="@{/order/list}">

                        View Orders

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<div th:replace="fragments/footer :: footer"></div>
