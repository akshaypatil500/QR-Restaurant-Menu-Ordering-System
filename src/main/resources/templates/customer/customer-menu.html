<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Restaurant Menu</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body style="background:#f5f7fb;">

<div class="container py-4">

    <!-- Restaurant Header -->
    <div class="card shadow border-0 mb-4">

        <div class="card-body text-center">

            <h2 class="text-primary">
                <i class="fa-solid fa-utensils"></i>
                QR Restaurant Menu
            </h2>

            <h5 class="mt-3">
                Table No :
                <span th:text="${table.tableNumber}"></span>
            </h5>

        </div>

    </div>

    <!-- Cart Button -->
    <div class="text-end mb-4">

        <a th:href="@{'/cart/' + ${table.id}}"
           class="btn btn-success">

            <i class="fa-solid fa-cart-shopping"></i>

            View Cart

        </a>

    </div>

    <!-- Category Wise Menu -->

    <div th:each="entry : ${categoryMenus}">

        <!-- Category Name -->

        <h3 class="text-primary mb-4">

            <i class="fa-solid fa-utensils"></i>

            <span th:text="${entry.key.name}"></span>

        </h3>

        <div class="row">

            <!-- Menu Card -->

            <div class="col-lg-4 col-md-6 mb-4"
                 th:each="menu : ${entry.value}">

                <div class="card shadow-sm border-0 h-100">

                    <!-- Food Image -->

                    <img
                            th:if="${menu.imageName!=null}"
                            th:src="@{'/uploads/menu/' + ${menu.imageName}}"
                            class="card-img-top"
                            style="height:220px;object-fit:cover;">

                    <img
                            th:if="${menu.imageName==null}"
                            src="https://placehold.co/600x400?text=No+Image"
                            class="card-img-top"
                            style="height:220px;object-fit:cover;">

                    <!-- Card Body -->

                    <div class="card-body">

                        <h5 class="fw-bold"
                            th:text="${menu.name}">
                        </h5>

                        <p class="text-muted"
                           th:text="${menu.description}">
                        </p>

                        <!-- Veg / Non-Veg -->

                        <span th:if="${menu.veg}"
                              class="badge bg-success">

                            Veg

                        </span>

                        <span th:unless="${menu.veg}"
                              class="badge bg-danger">

                            Non Veg

                        </span>

                        <!-- Price -->

                        <h4 class="text-primary mt-3">

                            ₹ <span th:text="${menu.price}"></span>

                        </h4>

                    </div>

                    <!-- Footer -->

                    <div class="card-footer bg-white border-0">

                        <a th:href="@{'/cart/add/' + ${table.id} + '/' + ${menu.id}}"
                           class="btn btn-primary w-100">

                            <i class="fa-solid fa-cart-plus"></i>

                            Add To Cart

                        </a>

                    </div>

                </div>

            </div>

            <!-- No Menu Available -->

            <div class="col-12"
                 th:if="${#lists.isEmpty(entry.value)}">

                <div class="alert alert-warning">

                    No menu available in this category.

                </div>

            </div>

        </div>

        <hr class="mb-5">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
