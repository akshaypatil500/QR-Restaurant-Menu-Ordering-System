<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customer Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="background:#f5f7fb;">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fa-solid fa-users"></i>
                Customer Orders
            </h2>

            <p class="text-muted mb-0">
                Monitor customer orders and their current status.
            </p>
        </div>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>Order</th>

                        <th>Table</th>

                        <th>Date</th>

                        <th>Total</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="order : ${orders}">

                        <td>
                            <strong th:text="'#' + ${order.id}">
                            </strong>
                        </td>


                        <td>
                            <span th:text="${order.table.tableNumber}">
                            </span>
                        </td>


                        <td>
                            <span th:text="${order.orderDate}">
                            </span>
                        </td>


                        <td>
                            ₹
                            <span th:text="${order.grandTotal}">
                            </span>
                        </td>


                        <td>

                            <span th:if="${order.status.name() == 'PENDING'}"
                                  class="badge bg-warning text-dark">
                                Order Placed
                            </span>

                            <span th:if="${order.status.name() == 'PREPARING'}"
                                  class="badge bg-primary">
                                Preparing
                            </span>

                            <span th:if="${order.status.name() == 'READY'}"
                                  class="badge bg-success">
                                Ready
                            </span>

                            <span th:if="${order.status.name() == 'SERVED'}"
                                  class="badge bg-info text-dark">
                                Served
                            </span>

                            <span th:if="${order.status.name() == 'PAID'}"
                                  class="badge bg-secondary">
                                Paid
                            </span>

                        </td>


                        <td>

                            <a th:href="@{'/order/details/' + ${order.id}}"
                               class="btn btn-sm btn-outline-primary">

                                <i class="fa-solid fa-eye"></i>

                                View

                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(orders)}">

                        <td colspan="6"
                            class="text-center text-muted py-4">

                            No customer orders found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
