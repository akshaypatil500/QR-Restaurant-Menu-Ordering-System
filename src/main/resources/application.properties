spring.application.name=qr-restaurant-menu-system

# =========================
# Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/qr_restaurant_menu_db
spring.datasource.username=root
spring.datasource.password=akki

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Server Configuration
# =========================
server.port=8080

app.file.upload-dir=${user.dir}/uploads/menu/
app.qr.upload-dir=uploads/qr/